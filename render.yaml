services:
  # ─── Backend API ──────────────────────────────────────────────────────
  - type: web
    name: agraja-sangam-api
    runtime: node
    region: oregon
    plan: starter
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false  # Set in Render Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://somashettihally.onrender.com
      - key: PORT
        value: 5000

  # ─── Frontend (Static Site) ──────────────────────────────────────────
  - type: static_site
    name: agraja-sangam-client
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /**
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://agraja-sangam-api.onrender.com
