services:
  # ─── Backend API (Node.js Web Service) ──────────────────────────────
  - type: web
    name: agraja-sangam-api
    runtime: node
    region: oregon
    plan: starter
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false  # ⚠️ Set this manually in Render Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false  # Set to your client URL after deploying frontend
      - key: PORT
        value: 5000
