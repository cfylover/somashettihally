services:
  # MongoDB Atlas (external) - configure MONGO_URI env var
  
  # Backend API
  - type: web
    name: agraja-sangam-api
    runtime: node
    region: oregon
    plan: starter
    buildCommand: cd server && npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false  # Set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://agraja-sangam-client.onrender.com
      - key: PORT
        value: 5000

  # Frontend (React/Vite - built as static site)
  - type: web
    name: agraja-sangam-client
    runtime: static
    region: oregon
    plan: free
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        value: https://agraja-sangam-api.onrender.com
